<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="manabixx-app-base" content="/flutter/">
<title>ページが見つかりません | MANABIXX</title>
<script>
(() => {
  const path = location.pathname;
  const appBase = document.querySelector('meta[name="manabixx-app-base"]')?.content || '/flutter/';
  if (path.startsWith(appBase) && path !== appBase) {
    const requested = path + location.search + location.hash;
    try { sessionStorage.setItem('manabixx_flutter_redirect', requested); } catch (_) {}
    location.replace(appBase);
  }
})();
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121214;color:#f5f5f6;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif}
main{padding:32px;text-align:center}a{color:#ff7900}
</style>
</head>
<body><main><h1>ページが見つかりません</h1><p>URLをご確認ください。</p><a href="/">MANABIXXホームへ戻る</a></main></body>
</html>
