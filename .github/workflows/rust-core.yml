name: Rust learning core
on:
  push:
    branches: [main, "rebuild/**"]
    paths: ["rust-core/**", ".github/workflows/rust-core.yml"]
  pull_request:
    paths: ["rust-core/**", ".github/workflows/rust-core.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path rust-core/Cargo.toml
      - run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust-core/Cargo.toml
