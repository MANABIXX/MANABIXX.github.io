name: Daily learning content sync
on:
  schedule:
    - cron: '30 21 * * *' # 06:30 JST
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-learning-content-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm install
      - name: Check for a newer content registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run update:registry-lock
      - name: Sync learning datasets
        run: npm run sync:registry
      - name: Validate content and application
        run: |
          bash scripts/verify-content.sh
          npm run check
          npm run validate:pwa
          npm run build
      - name: Detect content changes
        id: changes
        run: |
          if git diff --quiet -- registry.lock.json static/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Learning content is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit updated learning content
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.lock.json static/data
          git commit -m "chore: daily sync learning content"
          git push origin HEAD:main
      - name: Trigger production deployment
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
