name: Study CI
on:
  push:
    branches: [sveltekit-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Sync pinned learning content
        run: npm run sync:registry
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Validate PWA configuration
        run: npm run validate:pwa
      - name: Build preview
        run: npm run build
      - name: Save preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: study-build-preview
          path: build/
          retention-days: 7
