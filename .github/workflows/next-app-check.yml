name: Next.js MVP check

on:
  push:
    paths:
      - "next-app/**"
      - ".github/workflows/next-app-check.yml"
  pull_request:
    paths:
      - "next-app/**"
      - ".github/workflows/next-app-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
