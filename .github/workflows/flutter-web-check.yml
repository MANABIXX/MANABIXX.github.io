name: Flutter Web migration check

on:
  push:
    branches:
      - migration/flutter-web-foundation-2026-11-14
  pull_request:
    branches: [main]
    paths:
      - "flutter/**"
      - ".github/workflows/flutter-web-check.yml"
      - "docs/flutter-migration-inventory.md"

permissions:
  contents: read

concurrency:
  group: flutter-web-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository tools
        working-directory: .
        run: npm install
      - name: Prepare offline dataset and versioned worker
        working-directory: .
        run: npm run prepare:flutter-offline
      - name: Prepare bundled Japanese fonts
        working-directory: .
        run: npm run fetch:flutter-fonts
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart sources
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      - name: Build GitHub Pages root output
        run: flutter build web --release --wasm --base-href /
      - name: Assemble complete offline root app
        working-directory: .
        run: npm run assemble:flutter-root && npm run validate:flutter-root
