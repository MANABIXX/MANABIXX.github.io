name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build MANABIXX Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: flutter
        run: flutter create --platforms=android --org jp.manabixx .

      - name: Resolve dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze Dart sources
        working-directory: flutter
        run: flutter analyze

      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANABIXX-Android-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
