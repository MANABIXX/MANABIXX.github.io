name: Daily question database import
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-question-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm install
      - name: Sync pinned question sources
        run: npm run sync:registry
      - name: Generate current question databases
        run: npm run generate:kosen && npm run generate:foundation-training
      - name: Validate and import reviewed daily batches
        run: npm run import:daily-questions
      - name: Validate merged Kosen question database
        run: npm run validate:kosen
      - name: Commit updated question databases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data
          if git diff --cached --quiet; then
            echo "No question database changes to commit."
          else
            git commit -m "chore: import reviewed daily question batches"
            git push
          fi
