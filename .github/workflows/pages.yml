name: Build and deploy Study
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install PDF text extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Sync pinned learning content
        run: npm run sync:registry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Kosen practice questions
        run: npm run generate:kosen
      - name: Validate learning content
        run: bash scripts/verify-content.sh
      - name: Type and Svelte checks
        run: npm run check
      - name: TypeScript type check
        run: npm run check:types
      - name: Validate PWA configuration
        run: npm run validate:pwa
      - name: Build static site
        run: npm run build
      - name: Prepare bundled Japanese fonts
        run: npm run fetch:flutter-fonts
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: flutter
        run: flutter analyze
      - name: Test Flutter app
        working-directory: flutter
        run: flutter test
      - name: Build Flutter beta for /flutter/
        working-directory: flutter
        run: flutter build web --release --wasm --base-href "${FLUTTER_BASE_HREF:-/flutter/}"
      - name: Add Flutter beta to Pages artifact
        run: |
          mkdir -p build/flutter
          cp -R flutter/build/web/. build/flutter/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
