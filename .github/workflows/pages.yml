name: Build and deploy Study
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install PDF text extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Sync pinned learning content
        run: npm run sync:registry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Kosen practice questions
        run: npm run generate:kosen
      - name: Validate registry-derived Kosen questions
        run: npm run validate:kosen
      - name: Generate foundation-training questions
        run: npm run generate:foundation-training
      - name: Import reviewed daily question batches
        run: npm run import:daily-questions
      - name: Validate merged Kosen question database
        run: npm run validate:kosen
      - name: Prepare complete offline dataset and versioned worker
        run: npm run prepare:flutter-offline
      - name: Validate learning content
        run: bash scripts/verify-content.sh
      - name: Type and Svelte checks
        run: npm run check
      - name: TypeScript type check
        run: npm run check:types
      - name: Validate PWA configuration
        run: npm run validate:pwa
      - name: Build static site
        run: npm run build
      - name: Prepare bundled Japanese fonts
        run: npm run fetch:flutter-fonts
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: flutter
        run: flutter analyze
      - name: Test Flutter app
        working-directory: flutter
        run: flutter test
      - name: Build Flutter as the Pages root app
        working-directory: flutter
        run: flutter build web --release --wasm --base-href /
      - name: Assemble complete offline root app
        run: npm run assemble:flutter-root && npm run validate:flutter-root
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter/build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
