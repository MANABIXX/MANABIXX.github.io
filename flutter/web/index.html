<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    (() => {
      const legacyPath = location.pathname;
      if (legacyPath === "/flutter" || legacyPath.startsWith("/flutter/")) {
        const cleanPath = legacyPath.replace(/^\/flutter(?=\/|$)/, "") || "/";
        history.replaceState(null, "", cleanPath + location.search + location.hash);
      }
      const path = location.pathname;
      const href = path.includes("/practice/kosen")
        ? "/manifest-kosen.webmanifest"
        : path.includes("/practice/foundation-training")
          ? "/manifest-foundation.webmanifest"
          : "/manifest.webmanifest";
      document.write('<link id="app-manifest" rel="manifest" href="' + href + '">');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="自分のペースで学び、理解を積み重ねる学習スペース。">
  <title>MANABIXX</title>
  <style>
    :root { color-scheme: dark; background: #121214; }
    html, body {
      width: 100%; min-height: 100%; margin: 0; background: #121214;
      color: #f5f5f6;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    }
    #app-loading {
      position: fixed; inset: 0; z-index: 9999; display: grid;
      place-items: center; background: #121214;
      transition: none;
    }
    #app-loading.done { opacity: 0; pointer-events: none; }
    .loading-content { display: grid; justify-items: center; gap: 18px; }
    .brand { font: 800 18px/1.2 -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: .12em; }
    .spinner {
      width: 25px; height: 25px; border: 3px solid #38383e;
      border-top-color: #ff7900; border-radius: 50%;
      animation: none;
    }
    .loading-label { color: #9999a1; font-size: 12px; }
    #pwa-install-banner { position: fixed; z-index: 10000; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #494950; border-radius: 18px; background: rgba(35,35,40,.97); box-shadow: none; font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
    #pwa-install-banner[hidden] { display: none; }
    #pwa-install-banner .pwa-copy { flex: 1; }
    #pwa-install-banner strong { display: block; margin-bottom: 2px; color: #fff; }
    #pwa-install-action { border: 0; border-radius: 11px; padding: 10px 12px; color: #fff; background: #ff7900; font-weight: 800; white-space: nowrap; }
    #pwa-install-close { border: 0; padding: 4px; color: #aaa; background: transparent; font-size: 18px; }
    @media (min-width: 700px) { #pwa-install-banner { left: auto; right: 24px; bottom: 24px; width: 390px; } }
    #reminder-toggle { position: fixed; z-index: 9998; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); border: 1px solid #494950; border-radius: 999px; padding: 10px 14px; color: #f5f5f6; background: #222226; font: 12px/1.2 -apple-system, BlinkMacSystemFont, sans-serif; }
    #reminder-toggle[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
  <script>
    (() => {
      try {
        const redirect = sessionStorage.getItem('manabixx_flutter_redirect');
        if (redirect) {
          sessionStorage.removeItem('manabixx_flutter_redirect');
          history.replaceState(null, '', redirect);
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="pwa-install-banner" hidden>
    <div class="pwa-copy"><strong>MANABIXXをホーム画面に追加</strong><span id="pwa-install-copy">追加するとアプリのように全画面で起動できます。</span></div>
    <button id="pwa-install-action" type="button">追加方法</button>
    <button id="pwa-install-close" type="button" aria-label="閉じる">×</button>
  </div>
  <div id="app-loading" role="status" aria-label="MANABIXXを読み込み中">
    <div class="loading-content">
      <div class="brand">MANABIXX</div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-label">読み込み中…</div>
    </div>
  </div>
  <script>
    (() => {
      const banner = document.getElementById("pwa-install-banner");
      const action = document.getElementById("pwa-install-action");
      const copy = document.getElementById("pwa-install-copy");
      const close = document.getElementById("pwa-install-close");
      const ua = navigator.userAgent || "";
      const ios = /iPhone|iPad|iPod/.test(ua);
      const android = /Android/.test(ua);
      const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      const manifest = document.getElementById("app-manifest");
      const modePath = location.pathname;
      if (modePath.includes("/practice/kosen")) {
        manifest.href = "/manifest-kosen.webmanifest";
        document.title = "MANABIXX 高専モード";
        const label = banner.querySelector("strong");
        if (label) label.textContent = "高専モードをホーム画面に追加";
      } else if (modePath.includes("/practice/foundation-training")) {
        manifest.href = "/manifest-foundation.webmanifest";
        document.title = "MANABIXX 下積みモード";
        const label = banner.querySelector("strong");
        if (label) label.textContent = "下積みモードをホーム画面に追加";
      }

      let installPrompt = null;
      const show = () => { try { if (!standalone && !localStorage.getItem("manabixx-pwa-dismissed")) banner.hidden = false; } catch (_) { if (!standalone) banner.hidden = false; } };
      if (ios && !standalone) { copy.textContent = "Safariの共有ボタンから「ホーム画面に追加」を選べます。"; action.textContent = "追加手順"; show(); }
      if (android && !standalone) { copy.textContent = "ブラウザのメニューからホーム画面への追加やアプリのインストールができます。"; show(); }
      window.addEventListener("beforeinstallprompt", (event) => { event.preventDefault(); installPrompt = event; action.textContent = "インストール"; if (android) show(); });
      action.addEventListener("click", async () => {
        if (installPrompt) { installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; banner.hidden = true; return; }
        alert(ios ? "Safariの共有ボタン →「ホーム画面に追加」を選択してください。" : "ブラウザのメニューから「アプリをインストール」または「ホーム画面に追加」を選択してください。");
      });
      close.addEventListener("click", () => { banner.hidden = true; try { localStorage.setItem("manabixx-pwa-dismissed", "1"); } catch (_) {} });
      window.manabixxOfflineReady = Promise.resolve();
      if ("serviceWorker" in navigator) {
        window.manabixxOfflineReady = navigator.serviceWorker.register("/flutter-sw.js", { updateViaCache: "none" }).then(async (registration) => {
          // The service worker changes whenever app assets or question data change.
          await registration.update();
          if ("periodicSync" in registration) {
            try {
              await registration.periodicSync.register("manabixx-weekly-data-sync", {
                minInterval: 7 * 24 * 60 * 60 * 1000
              });
            } catch (_) {
              // Periodic Background Sync is browser- and permission-dependent.
            }
          }
          return navigator.serviceWorker.ready;
        }).catch(() => null);
      }

      // Notifications are delivered while this PWA page remains open.
      const reminder = document.createElement("button");
      reminder.id = "reminder-toggle";
      reminder.type = "button";
      const reminderKey = "manabixx.daily-reminder";
      const loadReminder = () => { try { return JSON.parse(localStorage.getItem(reminderKey) || "null"); } catch (_) { return null; } };
      let reminderState = loadReminder();
      const renderReminder = () => { reminder.textContent = reminderState && reminderState.enabled ? "通知 ON · " + reminderState.time : "学習通知 OFF"; };
      reminder.hidden = standalone && !modePath.includes("/practice/");
      renderReminder();
      let notifiedDay = localStorage.getItem("manabixx.daily-reminder.last-sent") || "";
      const checkReminder = () => {
        if (!reminderState || !reminderState.enabled || !("Notification" in window) || Notification.permission !== "granted") return;
        const now = new Date();
        const day = now.getFullYear() + "-" + (now.getMonth()+1) + "-" + now.getDate();
        const time = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
        if (time === reminderState.time && notifiedDay !== day) {
          new Notification("MANABIXX 学習リマインダー", { body: "今日の学習を始めましょう。", icon: modePath.includes("/practice/kosen") ? "/kosen-icon.svg" : "/foundation-icon.svg" });
          notifiedDay = day;
          localStorage.setItem("manabixx.daily-reminder.last-sent", day);
        }
      };
      window.setInterval(checkReminder, 30000);
      reminder.addEventListener("click", async () => {
        if (reminderState && reminderState.enabled) {
          reminderState.enabled = false;
          localStorage.setItem(reminderKey, JSON.stringify(reminderState));
          renderReminder();
          return;
        }
        if (!("Notification" in window)) { alert("このブラウザーは通知に対応していません。"); return; }
        const permission = await Notification.requestPermission();
        if (permission !== "granted") { alert("ブラウザーの通知を許可してください。"); return; }
        const time = prompt("毎日の通知時刻を入力してください（例 20:00）。ページを開いている間に通知します。", "20:00");
        if (!time || !/^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(time)) return;
        const normalized = time.split(":").map(v => v.padStart(2,"0")).join(":");
        reminderState = { enabled: true, time: normalized };
        localStorage.setItem(reminderKey, JSON.stringify(reminderState));
        renderReminder();
      });
      document.body.appendChild(reminder);

    })();
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    const flutterConfig = {
      // GitHub Pages cannot set COOP/COEP, so use the predictable
      // single-threaded SkWasm path where the browser supports WasmGC.
      wasmAllowList: { blink: true, webkit: true, gecko: true },
      forceSingleThreadedSkwasm: true,
      suppressMultithreadingWarning: true,
    };
    _flutter.loader.load({
      config: flutterConfig,
      onEntrypointLoaded: async (engineInitializer) => {
        // First launch waits for the complete app and dataset cache, up to two minutes.
        await Promise.race([
          window.manabixxOfflineReady || Promise.resolve(),
          new Promise((resolve) => window.setTimeout(resolve, 120000)),
        ]);
        const appRunner = await engineInitializer.initializeEngine(flutterConfig);
        await appRunner.runApp();
        const splash = document.getElementById('app-loading');
        if (splash) {
          splash.classList.add('done');
          window.setTimeout(() => splash.remove(), 180);
        }
      },
    });
  </script>
</body>
</html>
